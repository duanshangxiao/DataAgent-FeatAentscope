# PGVector 轻量单节点示例。
#
# 镜像基线：pgvector/pgvector:pg16-bookworm
# 启动：docker compose -f docker-file/docker-compose-pgvector.yml up -d
# 停止：docker compose -f docker-file/docker-compose-pgvector.yml down
# 删除容器和数据：docker compose -f docker-file/docker-compose-pgvector.yml down -v
#
# 生产使用时应通过 Secret 覆盖默认账号密码，并建议把镜像固定到经过验证的 digest。

services:
  pgvector:
    image: ${DATA_AGENT_PGVECTOR_IMAGE:-pgvector/pgvector:pg16-bookworm}
    container_name: data-agent-pgvector
    hostname: pgvector

    environment:
      # 仅用于本地和轻量内网示例；生产必须通过 Secret 覆盖密码。
      POSTGRES_DB: ${DATA_AGENT_VECTORSTORE_DATABASE:-vector_db_feat}
      POSTGRES_USER: ${DATA_AGENT_VECTORSTORE_USERNAME:-data_agent}
      POSTGRES_PASSWORD: ${DATA_AGENT_VECTORSTORE_PASSWORD:-data_agent}
      PGDATA: /var/lib/postgresql/data/pgdata

    # 只绑定本机回环地址，容器内后端通过 app-network 访问 pgvector:5432。
    ports:
      - "127.0.0.1:${DATA_AGENT_PGVECTOR_PORT:-5432}:5432"

    volumes:
      - data-agent-pgvector-data:/var/lib/postgresql/data
      # 只在全新数据目录首次初始化时执行；已有 Volume 的升级必须手工执行升级 SQL。
      - ./config/pgvector:/docker-entrypoint-initdb.d:ro

    # 面向轻量生产的保守资源参数；应按实际数据量和宿主机内存压测调整。
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200

    shm_size: 128mb
    mem_limit: 768m
    mem_reservation: 384m
    cpus: "1.0"

    networks:
      - app-network

    restart: unless-stopped
    stop_grace_period: 30s

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  app-network:
    driver: bridge
    name: data-agent-network

volumes:
  data-agent-pgvector-data:
