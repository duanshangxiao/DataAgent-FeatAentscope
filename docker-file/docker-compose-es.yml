# Elasticsearch 8.18.0 轻量单节点示例。
#
# 前置条件 (macOS Docker Desktop 自动满足，Linux 需手动执行):
#   sudo sysctl -w vm.max_map_count=262144
#
# 启动: docker compose -f docker-file/docker-compose-es.yml up -d
# 停止: docker compose -f docker-file/docker-compose-es.yml down
# 彻底清理 (含数据): docker compose -f docker-file/docker-compose-es.yml down -v
#
# 默认官方镜像不包含 IK。中文关键词检索用于生产时，应通过 DATA_AGENT_ES_IMAGE
# 指定预装与 ES 8.18.0 完全匹配的 analysis-ik 自定义镜像，并固定镜像 digest。

services:
  elasticsearch:
    image: ${DATA_AGENT_ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.18.0}
    container_name: data-agent-elasticsearch
    hostname: es-node-01

    environment:
      # 轻量部署采用单节点模式；需要高可用时应使用独立的多节点部署清单。
      - discovery.type=single-node

      # 仅允许在本机或可信内网关闭认证，不得直接暴露到公网。
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false

      # 关闭当前项目未使用的组件，减少轻量部署的常驻资源。
      - xpack.ml.enabled=false
      - xpack.watcher.enabled=false
      - xpack.graph.enabled=false

      # JVM 堆固定为 512MB；容器总内存需额外预留堆外内存和文件缓存。
      - ES_JAVA_OPTS=${DATA_AGENT_ES_JAVA_OPTS:--Xms512m -Xmx512m}
      - bootstrap.memory_lock=true
      - action.destructive_requires_name=true
      - path.repo=/usr/share/elasticsearch/snapshots

    volumes:
      - data-agent-es-data:/usr/share/elasticsearch/data
      - data-agent-es-snapshots:/usr/share/elasticsearch/snapshots

    ports:
      # 只暴露到本机；容器内后端通过 app-network 访问 elasticsearch:9200。
      - "127.0.0.1:${DATA_AGENT_ES_HTTP_PORT:-9200}:9200"

    # 容器资源限制 (ES 是内存大户，开发环境必须限)
    mem_limit: 1280m
    mem_reservation: 512m
    cpus: "2"

    # Linux 下 ES 需要高文件描述符限制；macOS Docker Desktop 虚拟化自动满足
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1

    networks:
      - app-network

    restart: unless-stopped
    stop_grace_period: 1m

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    labels:
      - "app=data-agent"
      - "component=elasticsearch"
      - "version=8.18.0"

networks:
  app-network:
    driver: bridge
    name: "data-agent-network"

volumes:
  data-agent-es-data:
  data-agent-es-snapshots:
