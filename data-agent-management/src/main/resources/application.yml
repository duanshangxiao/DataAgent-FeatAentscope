server:
  port: 8065

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 存储 DataAgent 业务数据的数据库，并非Agent分析数据的来源
spring:
  datasource:
    url: ${DATA_AGENT_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3360/feat-agentscope?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DATA_AGENT_DATASOURCE_USERNAME:root}
    password: ${DATA_AGENT_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  sql:
    init:
      mode: ${DATA_AGENT_DATASOURCE_SQL_INIT:never}
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
      continue-on-error: true
      separator: ;
      encoding: utf-8
  ai:
    vectorstore:
      # 向量库后端：elasticsearch（默认混合检索）、pgvector（纯向量检索）或 simple（测试）。
      # 生产环境通过环境变量切换，不需要修改配置文件。
      type: ${DATA_AGENT_VECTORSTORE_TYPE:elasticsearch}

      # PGVector 使用独立数据源，不复用保存业务数据的 MySQL/PostgreSQL 数据源。
      # 数据库必须预装 vector 扩展并提前执行 docker-file/config/pgvector/01-init-vector-store.sql。
      # 应用不会在启动时自动建表或修改旧表，避免生产启动产生隐式数据库变更。
      pgvector:
        url: ${DATA_AGENT_VECTORSTORE_URL:jdbc:postgresql://localhost:5432/vector_db_feat?currentSchema=public&ApplicationName=data-agent-vectorstore&tcpKeepAlive=true&connectTimeout=10&socketTimeout=30}
        username: ${DATA_AGENT_VECTORSTORE_USERNAME:data_agent}
        password: ${DATA_AGENT_VECTORSTORE_PASSWORD:}
        driver-class-name: org.postgresql.Driver
        schema-name: ${DATA_AGENT_VECTORSTORE_SCHEMA:public}
        table-name: ${DATA_AGENT_VECTORSTORE_TABLE:cares_data_agent_weihai}
        # 必须与实际 Embedding Model 输出维度和初始化 SQL 保持一致。
        dimensions: ${DATA_AGENT_VECTORSTORE_DIMENSIONS:1024}
        # 启动时校验既有表结构；校验失败应阻止服务带病启动，但不会自动迁移表结构。
        schema-validation: ${DATA_AGENT_VECTORSTORE_SCHEMA_VALIDATION:true}
        # 轻量生产环境的独立连接池，避免向量检索占满管理库连接。
        minimum-idle: ${DATA_AGENT_VECTORSTORE_POOL_MIN_IDLE:1}
        maximum-pool-size: ${DATA_AGENT_VECTORSTORE_POOL_MAX_SIZE:5}
        connection-timeout-ms: ${DATA_AGENT_VECTORSTORE_POOL_CONNECTION_TIMEOUT_MS:10000}
        validation-timeout-ms: ${DATA_AGENT_VECTORSTORE_POOL_VALIDATION_TIMEOUT_MS:5000}
        idle-timeout-ms: ${DATA_AGENT_VECTORSTORE_POOL_IDLE_TIMEOUT_MS:600000}
        max-lifetime-ms: ${DATA_AGENT_VECTORSTORE_POOL_MAX_LIFETIME_MS:1800000}

      # Elasticsearch 由 Spring AI 管理索引；不会自动启动 ES 进程或安装中文分词插件。
      elasticsearch:
        index-name: ${DATA_AGENT_ELASTICSEARCH_INDEX_NAME:spring-ai-document-index}
        # 只在索引不存在时初始化；Mapping 或维度变化仍需显式新建索引并重灌数据。
        initialize-schema: ${DATA_AGENT_ELASTICSEARCH_INITIALIZE_SCHEMA:true}
        # 必须与实际 Embedding Model 输出维度一致。
        dimensions: ${DATA_AGENT_VECTORSTORE_DIMENSIONS:1024}

    alibaba:
      data-agent:
        vector-store:
          table-topk-limit: ${DATA_AGENT_VECTORSTORE_TABLE_TOPK:10}
          table-similarity-threshold: ${DATA_AGENT_VECTORSTORE_TABLE_SIMILARITY_THRESHOLD:0.2}
          default-topk-limit: ${DATA_AGENT_VECTORSTORE_DEFAULT_TOPK:8}
          default-similarity-threshold: ${DATA_AGENT_VECTORSTORE_DEFAULT_SIMILARITY_THRESHOLD:0.4}
          # ES 下启用向量 + 关键词双路召回和 RRF 融合；PG 下自动退化为纯向量召回。
          enable-hybrid-search: ${DATA_AGENT_VECTORSTORE_ENABLE_HYBRID_SEARCH:true}
          # ES 关键词分支不提前截断，统一交给 RRF 排序；PG 模式不使用此参数。
          elasticsearch-min-score: ${DATA_AGENT_ELASTICSEARCH_MIN_SCORE:0.0}
        llm-service-type: stream
        code-executor:
          # 运行Python代码的环境（生产环境建议使用docker，不建议使用local）
          code-pool-executor: local
          # Python执行的最大重试次数
          python-max-tries-count: 5
        file:
          type: local
          path-prefix: data-agent
          # 当前目录下不要用点， ./uploads win下拼接完整格式路径会解析不了，比如 data-agent/./uploads win识别不了
          path: uploads
          url-prefix: /uploads
          imageSize: 2097152
          oss:
            access-key-id: ${OSS_ACCESS_KEY_ID:}
            access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
            endpoint: ${OSS_ENDPOINT:}
            bucket-name: ${OSS_BUCKET_NAME:}
            custom-domain: ${OSS_CUSTOM_DOMAIN:}
        skills:
          local-path: ./agent-skills
        capabilities:
          metric-system:
            enabled: true
            parser-format: ${DATA_AGENT_METRIC_PARSER_FORMAT:openapi3}
            swagger-url: ${DATA_AGENT_METRIC_SWAGGER_URL:http://127.0.0.1:8081/v3/api-docs/metric}
            base-url: ${DATA_AGENT_METRIC_BASE_URL:http://127.0.0.1:8081}
            refresh-interval-seconds: 1800
            route-threshold: 0.75
            timeout-ms: 10000
            max-response-bytes: ${DATA_AGENT_METRIC_MAX_RESPONSE_BYTES:262144}
            max-result-rows: ${DATA_AGENT_METRIC_MAX_RESULT_ROWS:200}
        max-sql-retry-count: 10
        # Langfuse 可观测性配置
        langfuse:
          enabled: ${LANGFUSE_ENABLED:false}
          host: ${LANGFUSE_HOST:}
          public-key: ${LANGFUSE_PUBLIC_KEY:}
          secret-key: ${LANGFUSE_SECRET_KEY:}
        agentscope:
          observability:
            enabled: ${AGENTSCOPE_OBSERVABILITY_ENABLED:true}
            use-langfuse-tracer: ${AGENTSCOPE_OBSERVABILITY_USE_LANGFUSE_TRACER:true}

  elasticsearch:
    # 轻量生产环境建议使用单节点内网地址；多节点可用逗号分隔多个 URI。
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
    # 开启 ES 安全认证时通过 Secret 注入，切勿把真实密码提交到仓库。
    username: ${SPRING_ELASTICSEARCH_USERNAME:}
    password: ${SPRING_ELASTICSEARCH_PASSWORD:}
    # 快速暴露网络故障，避免请求长期占用检索线程。
    connection-timeout: ${SPRING_ELASTICSEARCH_CONNECTION_TIMEOUT:5s}
    socket-timeout: ${SPRING_ELASTICSEARCH_SOCKET_TIMEOUT:30s}
  webflux:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

mybatis:

  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志配置
logging:
  level:
    com.alibaba.cloud.ai.dataagent.management.service: debug
    com.alibaba.cloud.ai.dataagent.aiagent: debug
    com.alibaba.cloud.ai.mapper: debug
    org.springframework.jdbc: debug
